version: 2
updates:
  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      action-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- npm (semantic-release toolchain) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- Gradle ---
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "org.jetbrains.kotlin.*"
          - "org.gradle:gradle-wrapper"
        update-types:
          - "minor"
          - "patch"
      gradle-kotlin:
        patterns:
          - "org.jetbrains.kotlin.*"
        update-types:
          - "minor"
          - "patch"

  # --- Base images of the Dockerfile, pinned by tag and digest ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types:
          - "version-update:semver-major"
